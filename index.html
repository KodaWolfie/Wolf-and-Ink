<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf & Ink | Home </title>

  <!-- Warm, elegant serif + soft readable body font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Nunito:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #2f1f17;
      --bg-soft: #3a271d;
      --card: #4a3226;
      --text: #f6e7d8;
      --muted: #e8cdb2;
      --accent: #d08c60;
      --accent-hover: #e5a276;
      --border: #6b4a38;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #4b2f22 0%, var(--bg) 45%, #23150f 100%);
      display: flex;
      justify-content: center;
      padding: 3rem 1.25rem;
    }

    .home {
      width: min(760px, 100%);
      background: linear-gradient(180deg, rgba(74, 50, 38, 0.85), rgba(58, 39, 29, 0.92));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.2rem 1.4rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
    }

    @media (min-width: 700px) {
      .home {
        padding: 2.8rem;
      }
    }

    h1, h2 {
      font-family: "Cormorant Garamond", serif;
      letter-spacing: 0.3px;
      margin: 0;
    }

    .welcome {
      font-size: clamp(2rem, 5vw, 3rem);
      color: #ffd9b8;
      margin-bottom: 0.6rem;
    }

    .subheading {
      margin: 0 0 2rem;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--muted);
      line-height: 1.6;
      max-width: 58ch;
    }

    .path-list {
      display: grid;
      gap: 1rem;
    }

    .path-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(32, 19, 13, 0.35);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1rem 0.95rem;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .path-card:hover,
    .path-card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: rgba(58, 35, 24, 0.6);
      outline: none;
    }

    .path-title {
      font-size: clamp(1.4rem, 3.2vw, 2rem);
      color: var(--accent-hover);
      margin-bottom: 0.15rem;
    }

    .path-sub {
      margin: 0;
      color: var(--text);
      opacity: 0.92;
      line-height: 1.45;
      font-size: 0.98rem;
    }
  </style>
</head>
<body>
  <main class="home">
    <header>
      <h1 class="welcome">Welcome, August Wolf!</h1>
      <p class="subheading">
        Your stories matter. Even if they're only in this little pocket of the internet.
      </p>
    </header>

    <section class="path-list" aria-label="Main sections">
      <a class="path-card" href="#ground-zero">
        <h2 class="path-title">Ground Zero</h2>
        <p class="path-sub">Crack your knuckles, Timmy! We got a blank page for you, Hero!</p>
      </a>

      <a class="path-card" href="library.html">
        <h2 class="path-title">The Beast's Library</h2>
        <p class="path-sub">Do you like it? It's yours, princess.</p>
      </a>

      <a class="path-card" href="#cover-creation">
        <h2 class="path-title">Cover Creation</h2>
        <p class="path-sub">Paint me like one of your French girls.</p>
      </a>
    </section>
  </main>
</body>
</html>

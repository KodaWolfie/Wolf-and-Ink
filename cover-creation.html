<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cover Creation | Wolf & Ink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Nunito:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #2f1f17;
      --bg-soft: #3a271d;
      --card: #4a3226;
      --text: #f6e7d8;
      --muted: #e8cdb2;
      --accent: #d08c60;
      --accent-hover: #e5a276;
      --border: #6b4a38;
      --danger: #c0524a;
      --danger-hover: #d96d63;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #4b2f22 0%, var(--bg) 45%, #23150f 100%);
      padding: 3rem 1.25rem;
    }

    h1, h2, h3 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      letter-spacing: 0.3px;
    }

    .page {
      width: min(1040px, 100%);
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(74,50,38,.85), rgba(58,39,29,.92));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.2rem 1.4rem;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
      backdrop-filter: blur(2px);
    }

    @media (min-width: 700px) {
      .page { padding: 2.8rem; }
    }

    .back-link,
    .nav-link {
      color: var(--accent);
      text-decoration: none;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .back-link:hover,
    .nav-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .page-title {
      font-size: clamp(2rem, 5vw, 3rem);
      color: #ffd9b8;
      margin-bottom: 0.4rem;
    }

    .page-sub {
      margin: 0 0 2rem;
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 1.2rem;
    }

    .field label {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      background: rgba(20,10,6,.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: "Nunito", sans-serif;
      font-size: 0.95rem;
      padding: 0.65rem 0.8rem;
      outline: none;
      transition: border-color 0.18s;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }

    .field select option { background: #3a271d; }

    .btn {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Nunito", sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 0.6rem 1.1rem;
      text-decoration: none;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
    }
    .btn-ghost:hover { background: rgba(208,140,96,.12); color: var(--accent-hover); border-color: var(--accent); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn-danger:hover { background: rgba(192,82,74,.15); color: var(--danger-hover); }

    .layout {
      display: grid;
      gap: 1.25rem;
    }

    @media (min-width: 860px) {
      .layout {
        grid-template-columns: minmax(0, 1.2fr) 280px;
        align-items: start;
      }
    }

    .panel {
      background: rgba(32,19,13,.35);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.2rem;
    }

    .hidden { display: none !important; }

    .preview-stage {
      display: grid;
      gap: 1rem;
    }

    .cover-preview {
      position: relative;
      width: min(100%, 320px);
      aspect-ratio: 2 / 3;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(74,50,38,.7), rgba(35,21,15,.92)),
        radial-gradient(circle at top, rgba(208,140,96,.22), rgba(0,0,0,0) 45%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    .cover-preview img,
    .thumb-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 1.25rem;
      line-height: 1.5;
    }

    .cover-title {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1.1rem 1rem 0.9rem;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(21,12,8,.88));
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: #fff3e7;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,.5);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .thumb-wrap {
      display: grid;
      gap: 0.75rem;
      justify-items: start;
    }

    .thumb-preview {
      position: relative;
      width: 80px;
      height: 120px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(58,39,29,.55);
    }

    .thumb-preview .cover-title {
      padding: 0.5rem 0.35rem 0.35rem;
      font-size: 0.72rem;
      line-height: 1.05;
    }

    .helper {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
  <script src="shared-store.js"></script>
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">← Back to home</a>
    <header>
      <h1 class="page-title">Cover Creation</h1>
      <p class="page-sub">Paint me like one of your French girls</p>
    </header>

    <div class="field" style="max-width:420px;">
      <label for="storySelect">Story</label>
      <select id="storySelect">
        <option value="">— Select a story —</option>
      </select>
    </div>

    <div class="layout">
      <section class="panel hidden" id="editorPanel">
        <div class="field">
          <label for="coverUpload">Upload cover image</label>
          <input id="coverUpload" type="file" accept="image/*" />
        </div>

        <div class="preview-stage">
          <div class="cover-preview" id="coverPreview"></div>
          <div class="action-row">
            <button class="btn btn-primary" id="saveCoverBtn" type="button" disabled>Save</button>
            <button class="btn btn-danger hidden" id="removeCoverBtn" type="button">Remove Cover</button>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="thumb-wrap">
          <h2 style="font-size:1.7rem;color:#ffd9b8;">Library Thumbnail</h2>
          <div class="thumb-preview" id="thumbPreview"></div>
          <p class="helper">This is how your cover will show up beside the story inside The Beast's Library.</p>
          <a class="nav-link" href="library.html">← Back to Library</a>
        </div>
      </aside>
    </div>
  </main>

  <script>
    WolfInkStore.migrateOldStories();

    const storySelect = document.getElementById("storySelect");
    const editorPanel = document.getElementById("editorPanel");
    const coverUpload = document.getElementById("coverUpload");
    const coverPreview = document.getElementById("coverPreview");
    const thumbPreview = document.getElementById("thumbPreview");
    const saveCoverBtn = document.getElementById("saveCoverBtn");
    const removeCoverBtn = document.getElementById("removeCoverBtn");

    let stories = [];
    let currentStoryId = "";
    let draftCover = null;

    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function refreshStories() {
      stories = WolfInkStore.loadStories().sort(function (a, b) {
        return a.title.localeCompare(b.title);
      });
    }

    function getCurrentStory() {
      return currentStoryId ? WolfInkStore.getStory(currentStoryId) : null;
    }

    function renderSelector() {
      storySelect.innerHTML = ['<option value="">— Select a story —</option>']
        .concat(stories.map(function (story) {
          return '<option value="' + story.id + '">' + escHtml(story.title) + "</option>";
        }))
        .join("");
      storySelect.value = stories.some(function (story) { return story.id === currentStoryId; }) ? currentStoryId : "";
      currentStoryId = storySelect.value;
    }

    function previewMarkup(story, image) {
      const title = story ? escHtml(story.title) : "Untitled Story";
      const imageMarkup = image
        ? '<img src="' + image + '" alt="Cover preview for ' + title + '">' 
        : '<div class="placeholder">No cover yet.<br>Upload an image to begin.</div>';
      return imageMarkup + '<div class="cover-title">' + title + "</div>";
    }

    function render() {
      const story = getCurrentStory();
      const activeImage = draftCover !== null ? draftCover : story && story.coverImage ? story.coverImage : null;

      editorPanel.classList.toggle("hidden", !story);
      saveCoverBtn.disabled = !story || !draftCover;
      removeCoverBtn.classList.toggle("hidden", !story || !story.coverImage);
      coverPreview.innerHTML = previewMarkup(story, activeImage);
      thumbPreview.innerHTML = previewMarkup(story, activeImage);

      if (!story) {
        thumbPreview.innerHTML = '<div class="placeholder">Select a story to preview its library cover.</div>';
      }
    }

    storySelect.addEventListener("change", function () {
      currentStoryId = storySelect.value;
      draftCover = null;
      coverUpload.value = "";
      refreshStories();
      render();
    });

    coverUpload.addEventListener("change", function () {
      const file = coverUpload.files && coverUpload.files[0];
      if (!file) {
        draftCover = null;
        render();
        return;
      }

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          const MAX_W = 600;
          const MAX_H = 900;
          let w = img.naturalWidth;
          let h = img.naturalHeight;
          if (w > MAX_W || h > MAX_H) {
            const ratio = Math.min(MAX_W / w, MAX_H / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          draftCover = canvas.toDataURL("image/jpeg", 0.82);
          render();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    saveCoverBtn.addEventListener("click", function () {
      const story = getCurrentStory();
      if (!story || !draftCover) return;
      WolfInkStore.saveStory({
        ...story,
        coverImage: draftCover
      });
      draftCover = null;
      coverUpload.value = "";
      refreshStories();
      render();
    });

    removeCoverBtn.addEventListener("click", function () {
      const story = getCurrentStory();
      if (!story) return;
      WolfInkStore.saveStory({
        ...story,
        coverImage: null
      });
      draftCover = null;
      coverUpload.value = "";
      refreshStories();
      render();
    });

    refreshStories();
    renderSelector();
    render();
  </script>
</body>
</html>
